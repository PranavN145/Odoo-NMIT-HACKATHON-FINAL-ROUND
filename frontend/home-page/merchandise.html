<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merchandise | Skyline Student Association</title>
  <meta name="description" content="Official Skyline Student Association collegiate apparel and gear." />
  
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- ========================================================================
       Public Site Header
       ======================================================================== -->
  <header class="site-header">
    <div class="header-inner">
      
      <!-- Left: Logo & Association Name (Using logo.png) -->
      <a href="./index.html" class="header-brand" aria-label="Skyline Student Association Home">
        <img src="./assets/logo.png" alt="Skyline Student Association Logo" class="brand-logo-img" />
        <span class="brand-title-text">Skyline Student Association</span>
      </a>

      <!-- Right: Navigation Links & Sign In Button (Events & Merchandise alongside Sign In) -->
      <div class="header-controls">
        
        <nav class="public-nav-links" aria-label="Main Navigation">
          <a href="./index.html" class="public-nav-item">Events</a>
          <a href="./merchandise.html" class="public-nav-item active">Merchandise</a>
        </nav>

        <!-- Simple Sign In Button Dropdown -->
        <div class="login-dropdown-wrapper" id="loginDropdownContainer">
          <button type="button" class="btn-signin-simple" id="loginDropdownBtn" aria-haspopup="true" aria-expanded="false" aria-label="Sign in dropdown">
            <span>Sign In</span>
            <svg class="profile-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <!-- Dropdown Options (Simple options without descriptive text) -->
          <div class="login-menu-dropdown simple-menu" id="loginDropdownMenu" role="menu">
            <!-- Role 1: Admin -->
            <a href="../admin/login.html" class="login-menu-item simple-item" role="menuitem">
              <div class="item-icon-badge manager" aria-hidden="true">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
              </div>
              <span class="item-text-title">Admin</span>
            </a>

            <!-- Role 2: Manager -->
            <a href="../manager/login.html" class="login-menu-item simple-item" role="menuitem">
              <div class="item-icon-badge manager" aria-hidden="true">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </div>
              <span class="item-text-title">Manager</span>
            </a>

            <!-- Role 3: Member -->
            <a href="../member/login.html" class="login-menu-item simple-item" role="menuitem">
              <div class="item-icon-badge member" aria-hidden="true">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <span class="item-text-title">Member</span>
            </a>

            <!-- Role 4: User -->
            <a href="../user/login.html" class="login-menu-item simple-item" role="menuitem">
              <div class="item-icon-badge user" aria-hidden="true">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
              </div>
              <span class="item-text-title">User</span>
            </a>
          </div>
        </div>

      </div>

    </div>
  </header>

  <!-- ========================================================================
       Public Merchandise Main Content Area (Styled similarly to Events Page)
       ======================================================================== -->
  <main class="public-main-container">
    
    <!-- MERCHANDISE SECTION -->
    <section class="catalog-section" id="merchandise-section">
      
      <!-- Header Bar: Heading Merchandise + Search field (Matching Events page) -->
      <div class="events-bar-header">
        <h2 class="events-title-heading">Merchandise</h2>
        
        <!-- Right: Search Input -->
        <div class="search-input-box-right">
          <input type="text" id="globalSearchInput" class="search-event-field" placeholder="Search merchandise.." aria-label="Search merchandise" />
          <svg class="search-icon-right" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <!-- Responsive Merchandise Grid -->
      <div class="cards-grid-4col" id="merchGrid">
        <!-- Populated by app.js with Navy Hoodie -->
      </div>

    </section>

    <!-- Minimal Public Footer -->
    <footer class="workspace-footer">
      <div class="workspace-footer-left">
        <span>Skyline Student Association</span>
        <span class="footer-bullet">·</span>
        <span>Merchandise</span>
      </div>
      <div>
        © 2026 Skyline Student Association. All rights reserved.
      </div>
    </footer>

  </main>

  <!-- ========================================================================
       Modal: Product Details & Purchase Checkout Flow
       ======================================================================== -->
  <div class="modal-scrim" id="participateModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-surface">
      <button type="button" class="modal-close-icon" id="modalCloseBtn" aria-label="Close dialog">×</button>
      <div id="modalDynamicContent"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./app.js"></script>
</body>
</html>
